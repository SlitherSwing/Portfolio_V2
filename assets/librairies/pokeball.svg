<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .outline { fill: none; stroke: #222224; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .red-fill { fill: #EE1515; }
      .white-fill { fill: #FFFFFF; }
      .black-fill { fill: #222224; }
    </style>
  </defs>

  <g id="closed-pokeball" transform="translate(50, 50)">
    <circle cx="0" cy="0" r="40" class="red-fill" />
    
    <rect x="-40" y="0" width="80" height="40" class="white-fill" />
    
    <circle cx="0" cy="0" r="40" class="outline" />
    
    <rect x="-39" y="-4" width="78" height="8" class="black-fill" />
    <line x1="-39" y1="0" x2="39" y2="0" class="outline" stroke-width="8"/>

    <g id="button">
      <circle cx="0" cy="0" r="12" class="black-fill" />
      <circle cx="0" cy="0" r="8" class="white-fill" />
      <circle cx="0" cy="0" r="4" fill="#ddd" />
    </g>
  </g>
</svg>